version: '3'

# https://taskfile.dev

vars:
  # Sources to check with clang-format/clang-tidy
  SOURCES: lib include/nn include/nnc

tasks:
  pr:
    desc: Run everything the PR checks
    cmds:
      - task: configure
      - task: build
      - task: check

  pr-build:
    cmds:
      - task: configure
      - task: build

  pr-check:
    cmds:
      - task: configure
      - task: check

  configure:
    desc: Configure CMake
    cmds:
      - task: cbindgen
      # TODO: Currently, we only build for a stub version 1.2.3
      # this means we might not catch errors that only happen
      # in one of the versions. This is partially mitigated
      # by building SMO and BOTW in CI
      - >
        cmake -G Ninja -B build -S .
        -DNN_SDK=1.2.3 
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DCMAKE_CXX_STANDARD=17
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
      - >
        cmake -G Ninja -B test/header_check/build -S test/header_check
        -DNN_SDK=1.2.3 
        -DCMAKE_CXX_STANDARD=17
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
  build:
    desc: Check the project builds and run tests
    cmds:
      - cmake --build build
      - cmake --build build --target all_verify_header_sets
      - cmake --build test/header_check/build

  check:
    desc: Run clang-format and clang-tidy checks
    cmds:
      # print versions in CI so it's 'Works On My Machine' is debugable
      - silent: true
        cmd: |
          if [ -n "$CI" ]; then
            clang-format --version
            clang-tidy --version
          fi
      - task: clang-format
        vars: { ARGS: -n -Werror }
      - task: clang-tidy
  fix:
    desc: Run clang-format to format the code
    cmds:
      - task: clang-format
        vars: { ARGS: -i }

  cbindgen:
    aliases: [cbg]
    desc: Generate nnc bindings
    env:
      LC_ALL: C
    cmds:
      - silent: true
        cmd: | 
          cd include/nn
          grep -rl "@nncbindgen" | sort > ../../out
          cd ../..
          cat out | xargs -P {{numCPU}} -n 1 python nncbindgen.py

  cbindgen-check:
    desc: Check nnc bindings are up-to-date
    env:
      NN_CBINDGEN_CHECK: 1
    cmds:
      - task: cbindgen
          
  clean:
    desc: Remove CMake build files
    cmds:
      - rm -rf build
      - rm -rf test/*/build

  clang-format:
    cmds:
      - silent: true
        cmd: > 
          echo 'running clang-format with {{numCPU}} cpus with args: {{.ARGS}}';
          find {{.SOURCES}}
          -regextype posix-extended
          -regex '.*\.[ch](\+\+|pp|xx|c|h)?'
          | xargs -P {{numCPU}} -n 1 clang-format {{.ARGS}}
  clang-tidy:
    vars:
      CMD: clang-tidy --warnings-as-errors="*" --header-filter="include/(nn|nvn|nvnTool|nv)" -p build --quiet
    cmds:
      - silent: true
        cmd: |
          echo 'running clang-tidy with {{numCPU}} cpus';
          find {{.SOURCES}} -regextype posix-extended -regex '.*\.[ch](\+\+|pp|xx|c|h)?' | xargs -P {{numCPU}} -n 1 sh -c 'printf "\r\033[Kclang-tidy: $1"; {{.CMD}} "$1"' _;
          echo ''
