version: '3'

# https://taskfile.dev

vars:
  # Sources to check with clang-format/clang-tidy
  SOURCES: lib include/nn include/nnc
  NX_AARCH64: 22.1.8-3

env:
  NX_AARCH64: '{{.NX_AARCH64}}'

tasks:
  pr:
    desc: Run everything the PR checks
    cmds:
      - task: configure
      - task: build
      - task: check

  pr-build:
    cmds:
      - task: configure
      - task: build

  pr-check:
    cmds:
      - task: configure
      - task: check

  configure:
    desc: Configure CMake
    vars:
      NN_VER_FROM_ENV:
        sh: echo $NN_VER
      NN_VER: '{{.NN_VER_FROM_ENV | default "1.0.0" | trim}}'
      CMAKE_ARGS: -G Ninja --toolchain $(pwd)/toolchain/Toolchain.cmake -DNN_SDK={{.NN_VER}} -DNN_SDK_TYPE=Release
    cmds:
      - silent: true
        cmd: |
          if [ -z "$CI" ]; then
            [ -d "toolchain/musl" ] || git clone https://github.com/open-ead/botw-lib-musl toolchain/musl
            VERSION={{.NX_AARCH64}}
            OUTPUT=toolchain
            [ -d "$OUTPUT/nx-aarch64-$VERSION" ] || curl -fsSL https://raw.githubusercontent.com/Pistonight/nx-aarch64/main/install.sh | VERSION="$VERSION" OUTPUT="$OUTPUT" sh
          fi
      - task: cbindgen
      - silent: true
        cmd: |
          if [ -z "{{.NN_VER_FROM_ENV}}" ]; then
            echo "-- Using default NN_VER ({{.NN_VER}}). Run 'NN_VER=x.y.z task configure' to configure for a specific SDK version"
          else
            echo "-- Using NN_VER: {{.NN_VER}}"
          fi
      - cmake {{.CMAKE_ARGS}} -B build
      - cmake {{.CMAKE_ARGS}} -B test/header_check/build -S test/header_check

  build:
    desc: Check the project builds and run tests
    cmds:
      - cmake --build build
      - cmake --build build --target all_verify_header_sets
      - cmake --build test/header_check/build

  check:
    desc: Run clang-format and clang-tidy checks
    cmds:
      # print versions in CI so it's 'Works On My Machine' is debugable
      - silent: true
        cmd: |
          if [ -n "$CI" ]; then
            clang-format --version
            clang-tidy --version
          fi
      - task: clang-format
        vars:
          ARGS: -n -Werror
      - task: clang-tidy

  fix:
    desc: Run clang-format to format the code
    cmds:
      - task: clang-format
        vars:
          ARGS: -i

  cbindgen:
    aliases:
      - cbg
    desc: Generate nnc bindings
    env:
      LC_ALL: C
    cmds:
      - silent: true
        cmd: |
          cd include/nn
          grep -rl "@nncbindgen" | sort > ../../out
          cd ../..
          cat out | xargs -P {{numCPU}} -n 1 python3 nncbindgen.py

  cbindgen-check:
    desc: Check nnc bindings are up-to-date
    env:
      NN_CBINDGEN_CHECK: 1
    cmds:
      - task: cbindgen

  clean:
    desc: Remove CMake build files
    cmds:
      - rm -rf build
      - rm -rf test/*/build

  clang-format:
    cmds:
      - silent: true
        cmd: |
          clang=$NX_CLANG
          if [ ! -d "$clang" ]; then
            clang="toolchain/nx-aarch64-$NX_AARCH64"
          fi
          if [ ! -d "$clang" ]; then
            echo "cannot find nx-aarch64 - please run 'task configure'"
            exit 1
          fi
          clang_format="$clang/bin/clang-format"
          echo 'running clang-format with {{numCPU}} cpus with args: {{.ARGS}}';
          find {{.SOURCES}} -regextype posix-extended -regex '.*\.[ch](\+\+|pp|xx|c|h)?' | xargs -P {{numCPU}} -n 1 $clang_format {{.ARGS}}

  clang-tidy:
    vars:
      ARGS: --warnings-as-errors="*" --header-filter="include/(nn|nvn|nvnTool|nv)" -p build --quiet
    cmds:
      - silent: true
        cmd: |
          clang=$NX_CLANG
          if [ ! -d "$clang" ]; then
            clang="toolchain/nx-aarch64-$NX_AARCH64"
          fi
          if [ ! -d "$clang" ]; then
            echo "cannot find nx-aarch64 - please run 'task configure'"
            exit 1
          fi
          clang_tidy="$clang/bin/clang-tidy"
          echo 'running clang-tidy with {{numCPU}} cpus';
          find {{.SOURCES}} -regextype posix-extended -regex '.*\.[ch](\+\+|pp|xx|c|h)?' | xargs -P {{numCPU}} -n 1 sh -c 'printf "\r\033[Kclang-tidy: $1"; '$clang_tidy' {{.ARGS}} "$1"' _;
          echo ''
